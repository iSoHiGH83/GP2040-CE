name: Build GP2040-CE (10 Macros)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        config: [Pico, FlatboxRev4, FlatboxRev5] # Trage hier deine Board-Configs ein (z.B. Pico,RP2040AdvancedBreakoutBoard)

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential python3-pip protobuf-compiler
        pip3 install protobuf grpcio-tools

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Patch Source & Web-UI to 10 Macro Slots
      run: |
        node -e '
        const fs = require("fs");
        function patch(f, fn) {
          if (!fs.existsSync(f)) return;
          const c = fs.readFileSync(f, "utf8");
          const u = fn(c);
          if (c !== u) { fs.writeFileSync(f, u, "utf8"); console.log("Patched:", f); }
        }

        // 1. MAX_MACROS = 10
        patch("headers/addons/input_macro.h", c => c.replace(/#define\s+MAX_MACROS\s+\d+/, "#define MAX_MACROS 10"));

        // 2. enums.proto
        patch("proto/enums.proto", c => {
          if (c.includes("ACTION_PRESS_MACRO_10")) return c;
          return c.replace(/(ACTION_PRESS_MACRO_6\s*=\s*(\d+);)/, (m, full, n) => {
            let v = parseInt(n, 10);
            return `${full}\n    ACTION_PRESS_MACRO_7 = ${v+1};\n    ACTION_PRESS_MACRO_8 = ${v+2};\n    ACTION_PRESS_MACRO_9 = ${v+3};\n    ACTION_PRESS_MACRO_10 = ${v+4};`;
          });
        });

        // 3. config.proto
        patch("proto/config.proto", c => c.replace(/(repeated\s+Macro\s+macroList\s*=\s*\d+\s*\[\(nanopb\)\.max_count\s*=\s*)\d+(\];)/, "$110$2"));

        // 4. Erhöhe DOC_SIZE & CONFIG_SIZE (verhindert Exit Code 2 static_assert Fehler)
        patch("headers/configs/webconfig.h", c => c.replace(/#define\s+DOC_SIZE\s+\d+/, "#define DOC_SIZE 32768"));
        patch("headers/configmanager.h", c => c.replace(/#define\s+CONFIG_SIZE\s+\d+/, "#define CONFIG_SIZE 16384"));
        patch("src/configmanager.cpp", c => c.replace(/#define\s+CONFIG_SIZE\s+\d+/, "#define CONFIG_SIZE 16384"));

        // 5. input_macro.cpp (falls Switch-Blöcke genutzt werden)
        patch("src/addons/input_macro.cpp", c => {
          if (c.includes("ACTION_PRESS_MACRO_10")) return c;
          return c.replace(/(case\s+GpioAction::ACTION_PRESS_MACRO_6:[\s\S]*?break;)/g,
            "$1\n        case GpioAction::ACTION_PRESS_MACRO_7: return 6;\n        case GpioAction::ACTION_PRESS_MACRO_8: return 7;\n        case GpioAction::ACTION_PRESS_MACRO_9: return 8;\n        case GpioAction::ACTION_PRESS_MACRO_10: return 9;");
        });

        // 6. Web-UI InputMacroAddonPage
        ["www/src/Pages/InputMacroAddonPage.tsx", "www/src/Pages/InputMacroAddonPage.jsx"].forEach(f => {
          patch(f, c => c.replace(/(MACRO_INPUTS_MAX\s*=\s*)\d+/g, "$110"));
        });

        // 7. Web-UI Locales & PinMapping
        const walk = (dir) => {
          if (!fs.existsSync(dir)) return;
          for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
            const fullPath = dir + "/" + entry.name;
            if (entry.isDirectory()) walk(fullPath);
            else if (/\.(js|jsx|ts|tsx)$/.test(entry.name)) {
              patch(fullPath, c => {
                if (c.includes("ACTION_PRESS_MACRO_10") || !c.includes("ACTION_PRESS_MACRO_6")) return c;
                return c.replace(/(ACTION_PRESS_MACRO_6\s*:\s*['"`][^'"`]+['"`],?)/g,
                  "$1\n\tACTION_PRESS_MACRO_7: \"Macro 7\",\n\tACTION_PRESS_MACRO_8: \"Macro 8\",\n\tACTION_PRESS_MACRO_9: \"Macro 9\",\n\tACTION_PRESS_MACRO_10: \"Macro 10\",");
              });
            }
          }
        };
        walk("www/src");
        '

    - name: Build Web-UI
      working-directory: ./www
      run: |
        npm install
        npm run build

    - name: Setup Pico SDK
      uses: actions/checkout@v4
      with:
        repository: raspberrypi/pico-sdk
        ref: 1.5.1
        path: pico-sdk
        submodules: recursive

    - name: Configure CMake
      env:
        PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
      run: |
        mkdir build
        cd build
        cmake -DGP2040-CE_BOARDCONFIG=${{ matrix.config }} -DBUILD_WEB=OFF ..

    - name: Build Firmware
      run: |
        cd build
        make -j$(nproc)

    - name: Upload UF2 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GP2040-CE_${{ matrix.config }}_10Macros
        path: build/*.uf2
